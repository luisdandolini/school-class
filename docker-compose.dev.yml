# Desenvolvimento: sobe só o banco. Backend/jogo rodam localmente com hot reload.
name: school-class-dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
