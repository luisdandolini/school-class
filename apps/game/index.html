<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Class</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- Tela de login (HTML comum, por cima do jogo) -->
    <main id="login" class="login" hidden>
      <form id="login-form" class="login-card" novalidate>
        <div class="login-logo" aria-hidden="true">🌳</div>
        <h1>School Class</h1>
        <p class="login-subtitle">Entre para continuar sua aventura</p>

        <label for="login-username">Usuário</label>
        <input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />

        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />

        <p id="login-error" class="login-error" role="alert"></p>

        <button id="login-submit" type="submit">Entrar</button>
        <p class="login-hint">Esqueceu a senha? Fale com seu professor.</p>
      </form>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
